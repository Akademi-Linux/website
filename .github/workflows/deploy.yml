name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the latest push deploys. An older run still in progress is cancelled.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: write # Publishes to the gh-pages branch.

env:
  WASM_PACK_VERSION: v0.15.1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          name="wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/${name}.tar.gz" | tar -xz
          echo "$PWD/$name" >> "$GITHUB_PATH"

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          npx gh-pages --dist dist --nojekyll
          --user "github-actions-bot <support+actions@github.com>"
          --repo "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
