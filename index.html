<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akademi Linux</title>
    <meta name="description" content="Open knowledge. Fair membership. Real infrastructure careers." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div class="page-tint" aria-hidden="true"></div>
    <div class="crt" aria-hidden="true"></div>

    <div id="app" class="relative z-[2] flex min-h-screen flex-col"><!--app--></div>

    <div class="scrim" id="scrim"></div>
    <div class="prompt" id="prompt" role="dialog" aria-modal="true" aria-label="Command prompt">
      <div class="prompt-msg" id="prompt-msg" aria-live="assertive"></div>
      <div class="suggest" id="suggest-box">
        <div class="suggest-head">SUGGESTIONS · ↑↓ move · Tab complete · Enter run</div>
        <ul id="suggest" role="listbox" aria-label="Command suggestions"></ul>
      </div>
      <div class="prompt-line">
        <label class="whitespace-nowrap text-al-term" for="cmd">visitor@akademi<span class="text-al-muted">:</span><span class="text-al-info">~</span><span class="text-al-muted">$</span></label>
        <div class="prompt-field">
          <span class="prompt-ghost" id="ghost" aria-hidden="true"></span>
          <input id="cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false" />
        </div>
        <button class="prompt-esc" id="esc" type="button" aria-label="Close command prompt">esc</button>
      </div>
    </div>

    <button class="hint" id="hint" type="button">Press <kbd>/</kbd> to open command prompt</button>
    <div class="sr-only" aria-live="polite" id="announce"></div>
  </body>
</html>
